[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare-dns-update"
version = "0.1.0"
description = "Declarative, idempotent sync engine that keeps Cloudflare DNS domain lists aligned with external feeds."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "cloudflare-dns-update contributors" }]
keywords = ["cloudflare", "gateway", "adblock", "dns", "automation", "blocklist"]
dependencies = [
    "httpx>=0.24,<0.25",
    "loguru>=0.7,<0.8",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "black>=24"]

[project.scripts]
cloudflare-dns-update = "cloudflare_dns_update.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
